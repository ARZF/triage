<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>داشبورد پزشک آزمایشی</title>
<style>:root{--paper:#f5f5ef;--surface:#fff;--ink:#203b35;--muted:#576b64;--line:#d5ddd5;--accent:#245d48;--tint:#eaf1e9;--danger:#9c2929}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 Tahoma,"Segoe UI",sans-serif}
.banner{padding:10px 16px;text-align:center;background:var(--ink);color:white}.shell{max-width:1050px;margin:auto;padding:24px 16px}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:28px;font-weight:500}h2{font-size:23px;font-weight:500}h3{font-size:19px}
button,input,select{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:6px;padding:8px 12px}button{background:var(--accent);color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}
input,select{width:100%;background:white;color:var(--ink)}input[type=checkbox]{width:auto}label{display:block;margin:12px 0 6px}fieldset{border:0;padding:0;margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button[aria-pressed=false]{background:white;color:var(--ink)}
.panel,.card{border:1px solid var(--line);border-radius:8px;background:white;padding:20px;margin:16px 0;min-width:0}.muted{color:var(--muted)}.error{color:var(--danger)}.error:empty{display:none}
.chip{display:inline-block;border:1px solid var(--line);background:var(--tint);border-radius:14px;padding:3px 10px;margin:3px}.tags{display:flex;flex-wrap:wrap;gap:6px}
p,dd,pre,h3{overflow-wrap:anywhere;white-space:pre-wrap}dt{font-size:14px;color:var(--muted)}dd{margin:4px 0 12px}details{border-top:1px solid var(--line);padding-top:12px;margin-top:16px}summary{cursor:pointer;min-height:44px}pre{font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap}
[hidden]{display:none!important}@media(max-width:600px){h1{font-size:24px}.panel,.card{padding:16px}.actions button{flex:1}}
/* Visit chat: scoped styles keep intake controls and dashboard refreshes independent. */
.visit-chat {margin-top:16px;border-top:1px solid var(--line);padding-top:12px;min-width:0;}
.visit-chat summary {cursor:pointer;min-height:44px;font-weight:650;}
.visit-chat-banner,.visit-chat-note {padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--tint);color:var(--ink);font-size:14px;overflow-wrap:anywhere;}
.visit-chat-log {height:280px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:12px;}
.visit-chat-message {align-self:flex-start;max-width:90%;flex-shrink:0;border-radius:10px;padding:10px 12px;background:var(--tint);color:var(--ink);min-width:0;}
.visit-chat-message.own {align-self:flex-end;background:var(--accent);color:var(--surface);}
.visit-chat-message p {margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere;}
.visit-chat-message small,.visit-chat-message time {font-size:12px;display:block;}
.visit-chat label {display:block;margin:12px 0 8px;font-size:14px;}
.visit-chat textarea {font:inherit;width:100%;min-width:0;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);color:var(--ink);}
.visit-chat-actions {display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;}
.visit-chat-count {font-size:13px;color:var(--muted);}
.visit-chat button {font:inherit;min-height:44px;padding:8px 12px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--surface);cursor:pointer;white-space:nowrap;}
.visit-chat .visit-chat-secondary {background:var(--surface);color:var(--accent);margin-top:8px;}
.visit-chat button:disabled,.visit-chat textarea:disabled {opacity:.6;cursor:not-allowed;}
.visit-chat-error {color:var(--danger);font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap;}
.visit-chat-error:empty {display:none;}
.visit-chat-end {padding:12px;border:1px solid var(--line);border-radius:8px;margin-top:8px;}
.visit-chat-end button {margin:4px;}
.visit-chat textarea[aria-invalid="true"] {border-color:var(--danger);}
.visit-chat :focus-visible {outline:3px solid var(--accent);outline-offset:3px;}
@media(max-width:480px){.visit-chat-log{height:240px;}.visit-chat-message{max-width:96%;}.visit-chat-end button{margin-inline:0;}}

</style></head>
<body><div class="banner">دموی آزمایشی — فقط اطلاعات ساختگی</div>
<main class="shell">
<header><h1 id="doctor-name">داشبورد پزشک</h1><div class="actions">
<label id="availability-control" hidden><input type="checkbox" id="available"> آمادهٔ پذیرش درخواست</label>
<button id="logout" type="button">خروج</button></div></header>
<section id="waiting" class="panel" role="status" hidden></section>
<section id="dashboard" hidden aria-label="درخواست‌های ویزیت">
<nav class="tabs" aria-label="صف و بیماران پذیرفته‌شده"><button id="queue-tab" aria-pressed="true" type="button">صف درخواست‌ها</button><button id="accepted-tab" aria-pressed="false" type="button">بیماران من</button></nav>
<p id="status" role="status" aria-live="polite">در حال دریافت درخواست‌ها...</p>
<p id="error" class="error" role="alert"></p>
<div id="requests"></div>
</section>
</main>
<script>

// ponytail: mirrored inline on two self-contained pages; extract a shared asset when a static-asset route is approved.
function createVisitChat(requestId, role, initiallyEnded) {
  const panel=document.createElement("details"), summary=document.createElement("summary");
  panel.className="visit-chat"; panel.dataset.chatId=requestId;
  summary.textContent=role==="patient"?"گفت‌وگو با پزشک":"گفت‌وگو با بیمار";
  const banner=document.createElement("p"); banner.className="visit-chat-banner";
  banner.textContent="این گفتگو برای موارد اورژانسی نیست؛ در شرایط اورژانسی با خدمات اورژانس تماس بگیرید";
  const log=document.createElement("div"); log.className="visit-chat-log"; log.setAttribute("role","log"); log.setAttribute("aria-live","polite"); log.setAttribute("aria-label","پیام‌های ویزیت"); log.tabIndex=0;
  const note=document.createElement("p"), error=document.createElement("p"), label=document.createElement("label");
  note.className="visit-chat-note"; note.setAttribute("role","status");
  error.className="visit-chat-error"; error.setAttribute("role","alert"); error.id="visit-error-"+requestId;
  const input=document.createElement("textarea"); input.id="visit-input-"+requestId; input.rows=3; input.dir="auto"; input.autocomplete="off";
  input.placeholder="پیام ساختگی خود را بنویسید..."; label.htmlFor=input.id; label.textContent="پیام شما";
  const counter=document.createElement("span"); counter.id="visit-count-"+requestId; counter.className="visit-chat-count";
  input.setAttribute("aria-describedby",counter.id+" "+error.id);
  const send=document.createElement("button"); send.type="button"; send.textContent="ارسال پیام";
  const actions=document.createElement("div"); actions.className="visit-chat-actions"; actions.append(counter,send);
  panel.append(summary,banner,log,note,label,input,actions,error);
  let ended=Boolean(initiallyEnded), full=false, unavailable=false, sending=false, ending=false, reading=false, cursor=0, timer=null, failures=0, endedHistoryLoaded=false;
  const seen=new Set(), messageNodes=new Map();
  const endButton=document.createElement("button"), confirmation=document.createElement("div"), endYes=document.createElement("button"), endNo=document.createElement("button");
  if(role==="doctor"){
    endButton.type=endYes.type=endNo.type="button"; endButton.textContent="پایان ویزیت"; endButton.className="visit-chat-secondary";
    confirmation.hidden=true; confirmation.className="visit-chat-end";
    const question=document.createElement("p"); question.textContent="با پایان ویزیت، ارسال پیام برای هر دو طرف بسته می‌شود. ویزیت پایان یابد؟";
    endYes.textContent="تأیید پایان ویزیت"; endNo.textContent="انصراف"; endNo.className="visit-chat-secondary";
    confirmation.append(question,endYes,endNo); panel.append(endButton,confirmation);
    endButton.addEventListener("click",()=>{confirmation.hidden=false;endYes.focus();});
    endNo.addEventListener("click",()=>{confirmation.hidden=true;endButton.focus();});
    endYes.addEventListener("click",async()=>{
      if(ending||sending||ended)return;
      ending=true;error.textContent="";controls();
      try{await call("/end","POST");setEnded(true);confirmation.hidden=true;await poll();}
      catch(reason){showError(reason);}
      finally{ending=false;controls();}
    });
  }
  function controls(){
    const locked=ended||full||unavailable||sending||ending;
    const length=[...input.value.trim()].length;
    input.disabled=locked;send.disabled=locked||!length||length>2000;
    send.textContent=sending?"در حال ارسال...":"ارسال پیام";
    counter.textContent=length.toLocaleString("fa-IR")+" / ۲۰۰۰";
    input.setAttribute("aria-invalid",String(length>2000));
    note.hidden=!ended&&!full;
    note.textContent=ended?"این ویزیت پایان یافته است. ارسال پیام بسته است؛ تاریخچهٔ گفتگو همچنان قابل مشاهده است.":full?"ظرفیت ۵۰۰ پیام این گفتگو تکمیل شده است. تاریخچه قابل مشاهده است.":"";
    endButton.hidden=ended;endButton.disabled=unavailable||sending||ending;endYes.disabled=endNo.disabled=sending||ending;
    panel.setAttribute("aria-busy",String(sending||ending));
    summary.textContent=(role==="patient"?"گفت‌وگو با پزشک":"گفت‌وگو با بیمار")+(ended?" · پایان‌یافته":"");
  }
  function setEnded(value){ended=ended||Boolean(value);if(ended)confirmation.hidden=true;controls();}
  function active(){return panel.open&&!document.hidden&&panel.isConnected&&panel.getClientRects().length>0&&!unavailable;}
  function pause(){clearTimeout(timer);timer=null;}
  function schedule(delay=failures>=2?10000:3000){pause();if(active()&&(!ended||!endedHistoryLoaded))timer=setTimeout(poll,delay);}
  async function call(suffix,method="GET",body){
    const response=await fetch("/v1/visit-requests/"+encodeURIComponent(requestId)+suffix,{
      method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},
      body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(10000)
    });
    if(response.status===401){location.replace("/login");throw Object.assign(Error(),{status:401});}
    if(!response.ok){
      let code;try{code=(await response.json()).error?.code;}catch{}
      throw Object.assign(Error(),{status:response.status,code});
    }
    return response.json();
  }
  function showError(reason,posting=false){
    if(reason.status===401)return;
    if(reason.status===404){unavailable=true;pause();}
    if(reason.code==="visit_ended")setEnded(true);
    if(reason.code==="chat_full")full=true;
    error.textContent=reason.status===404?"این گفتگو در دسترس نیست."
      :reason.code==="visit_ended"?"ویزیت پایان یافته است؛ ارسال پیام ممکن نیست."
      :reason.code==="chat_full"?"ظرفیت ۵۰۰ پیام گفتگو تکمیل شده است."
      :reason.status===422?"پیام باید بین ۱ تا ۲۰۰۰ نویسه باشد."
      :posting?"ارسال تأیید نشد؛ ممکن است پیام ثبت شده باشد. متن حفظ شده است؛ تاریخچه را بررسی کنید و در صورت نیاز دوباره بفرستید."
      :"ارتباط برقرار نشد. دریافت پیام‌ها به‌طور خودکار دوباره انجام می‌شود.";
    controls();
  }
  function append(message){
    if(seen.has(message.id))return;
    const follow=log.scrollHeight-log.scrollTop-log.clientHeight<64||message.sender===role;
    const node=document.createElement("article");node.className="visit-chat-message"+(message.sender===role?" own":"");
    const who=document.createElement("small"), text=document.createElement("p"), time=document.createElement("time");
    who.textContent=message.sender===role?"شما":message.sender==="doctor"?"پزشک":"بیمار";
    text.textContent=message.content;text.dir="auto";
    time.dateTime=message.created_at;time.textContent=new Date(message.created_at).toLocaleString("fa-IR");
    node.append(who,text,time);
    const next=[...messageNodes.keys()].sort((a,b)=>a-b).find(id=>id>message.id);
    log.insertBefore(node,next===undefined?null:messageNodes.get(next));messageNodes.set(message.id,node);seen.add(message.id);
    if(seen.size>=500)full=true;
    if(follow)log.scrollTop=log.scrollHeight;
  }
  async function poll(){
    pause();if(!active()||reading)return;
    reading=true;
    try{
      let more;
      do{
        const page=await call("/messages?after="+cursor+"&limit=100");
        for(const message of page.messages)append(message);
        if(page.messages.length)cursor=page.messages[page.messages.length-1].id;
        setEnded(page.ended);more=page.has_more;
        endedHistoryLoaded=page.ended&&!more;
      }while(more&&active());
      failures=0;error.textContent="";controls();
    }catch(reason){failures++;showError(reason);}
    finally{reading=false;schedule();}
  }
  async function post(){
    const content=input.value.trim();
    if(sending||ending||ended||full||unavailable||!content||[...content].length>2000)return;
    sending=true;error.textContent="";controls();
    try{
      const message=await call("/messages","POST",{content});
      append(message);input.value="";failures=0;await poll();
    }catch(reason){
      // ponytail: POST timeouts have ambiguous outcomes; add idempotency keys before automatic message resending.
      showError(reason,true);schedule();
    }finally{sending=false;controls();}
  }
  input.addEventListener("input",controls);
  input.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey&&!event.isComposing){event.preventDefault();post();}});
  send.addEventListener("click",post);
  panel.addEventListener("toggle",()=>{if(panel.open)poll();else pause();});
  const visibility=()=>{if(document.hidden)pause();else poll();};
  document.addEventListener("visibilitychange",visibility);
  controls();
  return {element:panel,list:log,setEnded,resume:()=>schedule(0),dispose:()=>{pause();document.removeEventListener("visibilitychange",visibility);}};
}

const nameLine=document.getElementById("doctor-name"), available=document.getElementById("available"), availabilityControl=document.getElementById("availability-control");
const dashboard=document.getElementById("dashboard"), waiting=document.getElementById("waiting"), requestList=document.getElementById("requests");
const statusLine=document.getElementById("status"), errorLine=document.getElementById("error"), queueTab=document.getElementById("queue-tab"), acceptedTab=document.getElementById("accepted-tab");
let user=null, items=[], specialtyNames={}, activeTab="pending", busy=false, loading=false;
const visitChats=new Map();
let renderedBusy=false;
const labels={age:"سن",height_cm:"قد (سانتی‌متر)",weight_kg:"وزن (کیلوگرم)",chief_complaint:"شکایت بیمار",symptoms:"علائم",duration:"مدت علائم",severity:"شدت",medical_history:"سابقه بیماری",medications:"داروهایی که مصرف می‌کنید",medication_history:"سابقه مصرف دارو",food_allergies:"حساسیت غذایی",allergies:"حساسیت دارویی / سایر حساسیت‌ها",additional_context:"توضیحات بیمار، فقط برای پزشک"};
const urgencyLabels={routine:"معمول",soon:"به‌زودی",urgent:"فوری",emergency:"اورژانسی",unknown:"نامشخص"};
async function request(path,body,method="GET"){
  const response=await fetch(path,{method,credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(10000)});
  if(response.status===401){location.replace("/login");throw Error("redirect");}
  if(!response.ok){const error=Error("request");error.status=response.status;throw error;}
  return response.status===204?null:response.json();
}
function paragraph(parent,text,className=""){const node=document.createElement("p");node.textContent=text;node.className=className;parent.append(node);return node;}
function renderFields(parent,data){
  const dl=document.createElement("dl");
  for(const [key,label] of Object.entries(labels)){
    if(!(key in data))continue;
    const term=document.createElement("dt");term.textContent=label;
    const value=document.createElement("dd");value.textContent=data[key]===null?"ثبت نشده":typeof data[key]==="number"?data[key].toLocaleString("fa-IR"):data[key];dl.append(term,value);
  }parent.append(dl);
  if(data.matched){
    const tags=document.createElement("div");tags.className="tags";
    for(const name of [...data.matched.symptoms,...data.matched.medicines]){
      const chip=document.createElement("span");chip.className="chip";chip.textContent=name;tags.append(chip);
    }parent.append(tags);
  }
}
function render(){
  const focused=document.activeElement,positions=[...visitChats.values()].map(chat=>[chat,chat.list.scrollTop]);
  renderedBusy=busy;
  for(const [id,chat] of visitChats){if(!items.some(item=>item.id===id&&item.status==="accepted")){chat.dispose();visitChats.delete(id);}}
  queueTab.setAttribute("aria-pressed",String(activeTab==="pending"));acceptedTab.setAttribute("aria-pressed",String(activeTab==="accepted"));
  requestList.replaceChildren();
  const visible=items.filter(item=>item.status===activeTab);
  statusLine.textContent=activeTab==="pending"&&!available.checked?"پذیرش درخواست غیرفعال است.":visible.length?visible.length.toLocaleString("fa-IR")+" درخواست":"درخواستی وجود ندارد.";
  for(const item of visible){
    const article=document.createElement("article");article.className="card";article.dataset.requestId=item.id;
    const title=document.createElement("h2");title.textContent=item.specialty.name_fa;article.append(title);
    paragraph(article,new Date(item.created_at).toLocaleString("fa-IR"),"muted");
    paragraph(article,"فوریت: "+(urgencyLabels[item.urgency]||item.urgency),"chip");
    if(item.status==="pending"){
      renderFields(article,item.preview);
      const accept=document.createElement("button");accept.type="button";accept.textContent="پذیرش درخواست";accept.disabled=busy||!available.checked;
      accept.addEventListener("click",()=>acceptRequest(item.id));article.append(accept);
    }else{
      if(!visitChats.has(item.id))visitChats.set(item.id,createVisitChat(item.id,"doctor",item.ended));
      const chat=visitChats.get(item.id);chat.setEnded(item.ended);article.append(chat.element);
      renderFields(article,item.patient);
      const previous=document.createElement("details"), summary=document.createElement("summary");summary.textContent="ویزیت‌های قبلی";previous.append(summary);
      if(!item.previous_visits.length)paragraph(previous,"ویزیت قبلی ثبت نشده است.");
      for(const visit of item.previous_visits){
        const section=document.createElement("section");paragraph(section,new Date(visit.date+"T00:00:00").toLocaleDateString("fa-IR"));renderFields(section,visit);
        if(visit.triage_specialty)paragraph(section,"تخصص پیشنهادی قبلی: "+(specialtyNames[visit.triage_specialty]||"نامشخص"),"muted");
        previous.append(section);
      }article.append(previous);
      if(item.ai){
        const ai=document.createElement("section");ai.className="panel";const heading=document.createElement("h3");heading.textContent="یادداشت پیشنهادی برای بررسی پزشک";ai.append(heading);
        paragraph(ai,item.ai.notice,"muted");paragraph(ai,item.ai.source==="llm"?"منبع: هوش مصنوعی":"منبع: پیشنهاد عمومی");
        paragraph(ai,item.ai.doctor_summary||"خلاصهٔ هوش مصنوعی موجود نیست.");
        const list=document.createElement("ul");for(const text of item.ai.considerations){const li=document.createElement("li");li.textContent=text;list.append(li);}ai.append(list);article.append(ai);
      }
    }requestList.append(article);
  }
  for(const [chat,position] of positions){if(chat.element.isConnected)chat.list.scrollTop=position;}
  for(const chat of visitChats.values())chat.resume();
  if(focused?.isConnected&&focused.closest(".visit-chat"))focused.focus({preventScroll:true});
}
async function refresh(){
  if(!user?.doctor?.verified||document.hidden||busy||loading)return;
  loading=true;
  try{const next=await request("/v1/doctor/requests");const changed=JSON.stringify(next)!==JSON.stringify(items);items=next;if(changed||renderedBusy!==busy)render();}
  catch(error){if(error.status===403){await refreshIdentity();}
    else if(error.message!=="redirect")errorLine.textContent="دریافت درخواست‌ها انجام نشد. دوباره تلاش می‌شود.";}
  finally{loading=false;}
}
async function acceptRequest(id){
  if(busy)return;busy=true;available.disabled=true;errorLine.textContent="";render();
  try{await request("/v1/doctor/requests/"+encodeURIComponent(id)+"/accept",undefined,"POST");activeTab="accepted";}
  catch(error){errorLine.textContent=error.status===409?"پزشک دیگری این درخواست را پذیرفت یا درخواست دیگر فعال نیست.":error.status===404?"این درخواست در دسترس نیست.":"پذیرش درخواست انجام نشد.";}
  finally{busy=false;available.disabled=false;await refresh();}
}
queueTab.addEventListener("click",()=>{activeTab="pending";render();refresh();});
acceptedTab.addEventListener("click",()=>{activeTab="accepted";render();refresh();});
available.addEventListener("change",async()=>{
  if(busy)return;busy=true;available.disabled=true;errorLine.textContent="";
  try{const result=await request("/v1/doctor/availability",{available:available.checked},"PUT");user.doctor.available=result.available;}
  catch{available.checked=user.doctor.available;errorLine.textContent="تغییر وضعیت انجام نشد.";}
  finally{busy=false;available.disabled=false;await refresh();}
});
document.getElementById("logout").addEventListener("click",async()=>{
  if(busy)return;busy=true;
  try{await request("/v1/auth/logout",undefined,"POST");location.replace("/login");}
  catch{errorLine.textContent="خروج انجام نشد. دوباره تلاش کنید.";}finally{busy=false;}
});
let identityLoading=false;
async function refreshIdentity(){
  if(document.hidden||identityLoading)return;
  identityLoading=true;
  try{
    const previous=user;
    user=(await request("/v1/auth/me")).user;
    if(user.role!=="doctor"){location.replace(user.role==="admin"?"/admin":"/demo");return;}
    nameLine.textContent=user.display_name;
    if(!user.doctor.verified){
      items=[];requestList.replaceChildren();
      for(const chat of visitChats.values())chat.dispose();visitChats.clear();
      dashboard.hidden=true;availabilityControl.hidden=true;waiting.hidden=false;waiting.replaceChildren();
      const notices={pending:"حساب شما در انتظار بررسی و تأیید مدیر است.",rejected:"درخواست شما توسط مدیر رد شده است.",suspended:"دسترسی پزشک توسط مدیر تعلیق شده است."};
      paragraph(waiting,notices[user.doctor.status]||"حساب هنوز تأیید نشده است.");
      if(user.doctor.review_note)paragraph(waiting,"یادداشت مدیر: "+user.doctor.review_note);
      return;
    }
    waiting.hidden=true;availabilityControl.hidden=false;dashboard.hidden=false;available.checked=user.doctor.available;
    if(!previous?.doctor?.verified){render();await refresh();}
  }catch(error){if(error.message!=="redirect"){waiting.hidden=false;waiting.textContent="دریافت وضعیت حساب انجام نشد. دوباره تلاش می‌شود.";}}
  finally{identityLoading=false;}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){refreshIdentity();refresh();}});
(async()=>{
  try {specialtyNames=Object.fromEntries((await request("/v1/specialties")).map(item=>[item.code,item.name_fa]));} catch {}
  await refreshIdentity();
  setInterval(refreshIdentity,5000);setInterval(refresh,10000);
})();
